name: Grade Juice Shop Lab

# Runs the submission checker every time a student pushes, and on PRs.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Validate findings submission
        run: pytest -q
